<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Тест деплоя — Панамастер</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; max-width: 720px;
               margin: 60px auto; padding: 0 20px; color: #1a1a1a; line-height: 1.6; }
        h1 { font-weight: 300; font-size: 36px; margin-bottom: 24px; }
        .row { padding: 16px 0; border-bottom: 1px solid #eaeaea; }
        .label { font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px;
                 color: #999; margin-bottom: 6px; }
        .value { font-size: 18px; }
        .accent { color: #E64B1E; }
    </style>
</head>
<body>
    <h1>Тестовая страница деплоя</h1>
    <div class="row">
        <div class="label">Последнее событие</div>
        <div class="value accent">тест</div>
    </div>
    <div class="row">
        <div class="label">Время события (МСК)</div>
        <div class="value">2026-09-22 00:05:29</div>
    </div>
    <div class="row">
        <div class="label">Источник</div>
        <div class="value">Telegram-бот → git push → GitHub Actions → сервер</div>
    </div>
</body>
</html>
